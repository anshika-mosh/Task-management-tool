name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check app and tests
        run: npm run typecheck
      - name: Unit, integration and component tests
        run: npm test
      - name: End-to-end tests (real browser, real build)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
